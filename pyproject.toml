[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "antennacalc"
version = "0.1.0"
description = "Amateur radio RF exposure (FCC MPE) calculator"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[project.scripts]
antennacalc = "antennacalc.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
