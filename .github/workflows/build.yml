name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk (Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build (Windows / Linux single file)
        if: matrix.name != 'macos'
        run: pyinstaller --onefile --windowed --name antennacalc --paths src run_antennacalc.py

      - name: Build (macOS app bundle)
        if: matrix.name == 'macos'
        run: pyinstaller --windowed --name antennacalc --paths src run_antennacalc.py

      - name: Package (macOS)
        if: matrix.name == 'macos'
        run: ditto -c -k --keepParent dist/antennacalc.app dist/antennacalc-macos.zip

      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: tar -C dist -czf dist/antennacalc-linux.tar.gz antennacalc

      - name: Package (Windows)
        if: matrix.name == 'windows'
        run: Copy-Item dist/antennacalc.exe dist/antennacalc-windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: antennacalc-${{ matrix.name }}
          path: |
            dist/antennacalc-windows.exe
            dist/antennacalc-macos.zip
            dist/antennacalc-linux.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
